name: build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: unzip -o umear-1.21.4.zip
      - run: gradle build
        working-directory: umear
      - uses: actions/upload-artifact@v4
        with:
          name: umear-mod
          path: |
            umear/build/libs/*.jar
            !umear/build/libs/*-sources.jar
