name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q umear-visuals-src.zip
          find umear-visuals-src/src -name "*.java" | wc -l
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build --no-daemon --console=plain
        working-directory: umear-visuals-src
      - uses: actions/upload-artifact@v4
        with:
          name: umear-visuals-jar
          path: umear-visuals-src/build/libs/umear-visuals-1.1.0.jar
          if-no-files-found: error
