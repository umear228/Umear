name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick project dir
        run: |
          if [ -f umear_project.zip ]; then
            rm -rf proj && mkdir proj && unzip -q umear_project.zip -d proj
            echo "DIR=proj" >> $GITHUB_ENV
          else
            echo "DIR=." >> $GITHUB_ENV
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        run: cd $DIR && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: umear-jar
          path: |
            ${{ env.DIR }}/build/libs/umear-*.jar
            !${{ env.DIR }}/build/libs/*-sources.jar
